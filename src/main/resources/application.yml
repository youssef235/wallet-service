spring:
  application:
    name: wallet-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  wallet:
    default-currency: ${WALLET_CURRENCY:EGP}
  paymob:
    enabled: ${PAYMOB_ENABLED:false}
    base-url: ${PAYMOB_BASE_URL:https://accept.paymob.com}
    api-key: ${PAYMOB_API_KEY:}
    integration-id: ${PAYMOB_INTEGRATION_ID:0}
    iframe-id: ${PAYMOB_IFRAME_ID:0}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
    topup-max-age-hours: ${TOPUP_MAX_AGE_HOURS:24}
    connect-timeout: ${PAYMOB_CONNECT_TIMEOUT:3s}
    read-timeout: ${PAYMOB_READ_TIMEOUT:10s}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:wallet-service@localhost}
    ops-alert-to: ${OPS_ALERT_EMAIL:}
  maintenance:
    reconcile-cron: ${RECONCILE_CRON:0 0 3 * * *}
    expire-topups-cron: ${EXPIRE_TOPUPS_CRON:0 */30 * * * *}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
