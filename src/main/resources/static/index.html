<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محفظتي — محفظة إلكترونية</title>
<script>
(function () {
  var q = new URLSearchParams(location.search).get('theme');
  var saved = q || localStorage.getItem('wt_theme');
  var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/wallet.css">
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="3.5"/>
          <path d="M3 10.5h18"/>
          <circle cx="16.6" cy="14.8" r="1.15" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>محفظتي</b>
        <small>محفظة إلكترونية</small>
      </span>
    </a>
    <div class="topbar-end">
      <span id="user-chip" class="user-chip" hidden></span>
      <button id="logout-btn" class="btn btn-quiet btn-sm" type="button" hidden>خروج</button>
      <button id="theme-toggle" class="theme-btn" type="button" aria-label="تبديل المظهر"></button>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="pay-modal" class="modal" hidden>
  <div class="modal-sheet">
    <div class="modal-head">
      <h3>إتمام الدفع</h3>
      <button id="pay-close" class="btn btn-quiet btn-sm" type="button">إغلاق</button>
    </div>
    <p class="modal-hint">بيئة تجريبية — بطاقة الاختبار: <code dir="ltr">4111 1111 1111 1111</code> · انتهاء <code dir="ltr">01/39</code> · CVV <code dir="ltr">123</code></p>
    <iframe id="pay-frame" title="بوابة الدفع" allow="payment"></iframe>
    <div class="modal-foot">
      <span id="pay-status" class="pay-status">بانتظار الدفع…</span>
      <button id="pay-check" class="btn btn-sm" type="button">تحقّق من الرصيد</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<script src="/js/wallet.js"></script>
</body>
</html>
