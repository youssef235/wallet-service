services:
  db:
    image: postgres:17
    container_name: wallet-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wallet-mailhog
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: .
    container_name: wallet-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      MAIL_HOST: mailhog
    ports:
      - "8081:8081"

volumes:
  wallet-db-data:
